name: EDS Accessibility Regression Agent
description: Accessibility regression detection for Adobe AEM Edge Delivery Services using axe-core.
author: Neeraj Raja

branding:
  icon: eye
  color: blue

inputs:
  config-path:
    description: Path to the a11y-agent config in the checked-out EDS repository.
    required: false
    default: a11y-agent.config.json
  baseline-path:
    description: Path to the committed accessibility baseline file.
    required: false
    default: .github/baselines/a11y.json
  update-baseline:
    description: Set to 'true' to update the baseline from the current scan instead of opening issues.
    required: false
    default: 'false'
  dry-run:
    description: Set to 'true' to log only, no issues opened.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 22

    - name: Install agent runtime dependencies
      shell: bash
      run: npm ci --omit=dev --prefix "$GITHUB_ACTION_PATH/a11y-agent"

    - name: Install Playwright Chromium
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/a11y-agent"
        npx playwright install --with-deps chromium

    - name: Run accessibility agent
      shell: bash
      env:
        A11Y_CONFIG_PATH: ${{ inputs.config-path }}
        A11Y_BASELINE_PATH: ${{ inputs.baseline-path }}
        A11Y_UPDATE_BASELINE: ${{ inputs.update-baseline }}
        DRY_RUN: ${{ inputs.dry-run }}
        REPO_OWNER: ${{ github.repository_owner }}
        REPO_NAME: ${{ github.event.repository.name }}
      run: node "$GITHUB_ACTION_PATH/a11y-agent/index.js"
